# ============================================================
# Smart Agriculture AI Layer — Nginx reverse proxy config
# ============================================================
# Placed in front of the FastAPI container (ai-layer on port 8000).
# Handles:
#   - HTTPS termination (SSL cert paths configured below)
#   - HTTP -> HTTPS redirect
#   - Security headers
#   - Gzip compression
#   - Request size limit (for image uploads -- should match MAX_IMAGE_SIZE_BYTES in routes.py)
#
# HOW TO USE:
# 1. Put your SSL certificate and private key here:
#       nginx/ssl/fullchain.pem     (certificate + chain)
#       nginx/ssl/privkey.pem       (private key)
#    For development, generate a self-signed cert with:
#       mkdir -p nginx/ssl
#       openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#           -keyout nginx/ssl/privkey.pem \
#           -out nginx/ssl/fullchain.pem \
#           -subj "/CN=localhost"
#    For production, use Let's Encrypt / Certbot.
#
# 2. Replace "your-domain.com" below with your actual domain.
# 3. Start with: docker compose up --build
# ============================================================

events {
    worker_connections 1024;
}

http {
    # ---- Gzip -------------------------------------------------------
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ---- Upstream: FastAPI AI layer ---------------------------------
    upstream ai_layer {
        server ai-layer:8000;
        keepalive 32;
    }

    # ---- HTTP -> HTTPS redirect ------------------------------------
    server {
        listen 80;
        server_name your-domain.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS server ----------------------------------------------
    server {
        listen 443 ssl;
        server_name your-domain.com;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Max upload size (must match MAX_IMAGE_SIZE_BYTES in api/routes.py = 8 MB)
        client_max_body_size 10m;

        # Timeouts for image upload + AI inference (can be slower than a typical API)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # ---- Proxy all requests to FastAPI -------------------------
        location / {
            proxy_pass         http://ai_layer;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ---- /health can be accessed without HTTPS redirect --------
        # (for Docker healthchecks inside the network that use HTTP)
        location /health {
            proxy_pass http://ai_layer/health;
            proxy_set_header Host $host;
        }
    }
}
